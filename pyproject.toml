[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-doctor"
version = "0.2.0"
description = "Maintenance CLI for the Claude Code / OpenClaw file-based memory system."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Solomon Neas", email = "srneas@gmail.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "brigade-cli @ git+https://github.com/escoffier-labs/brigade.git@main",
]

[project.urls]
Homepage = "https://github.com/escoffier-labs/memory-doctor"
Repository = "https://github.com/escoffier-labs/memory-doctor"

[project.scripts]
memory-doctor = "memory_doctor.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.metadata]
# brigade-cli is referenced by git URL until it is pinned to a PyPI release.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/memory_doctor"]
